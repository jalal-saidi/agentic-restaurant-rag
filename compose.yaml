name: agentic-restaurant-rag

services:
  mcp:
    build:
      context: .
    command: ["python", "-m", "connoisseur.mcp.server"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_ROOT: /app
      CHROMA_PATH: /app/.data/chroma
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-semantic}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    init: true
    restart: unless-stopped
    ports:
      - "${MCP_PUBLISHED_PORT:-8001}:8001"
    volumes:
      - chroma_data:/app/.data/chroma
      - chroma_model_cache:/app/.cache/chroma
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "connoisseur.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MCP_SERVER_URL: http://mcp:8001/mcp
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    ports:
      - "${API_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
    command: ["python", "-m", "connoisseur.client.gradio_app"]
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISHED_PORT:-7860}:7860"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  chroma_data:
  chroma_model_cache:
