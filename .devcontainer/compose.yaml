x-dev-service: &dev-service
  build:
    context: ..
    dockerfile: .devcontainer/Dockerfile
  image: agentic-restaurant-rag:dev
  init: true
  working_dir: /workspaces/agentic-restaurant-rag
  volumes:
    - ..:/workspaces/agentic-restaurant-rag:cached
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  dev:
    <<: *dev-service
    command: ["sleep", "infinity"]
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://api:8000
      MCP_SERVER_URL: http://mcp:8001/mcp
      PYTHONPATH: /workspaces/agentic-restaurant-rag/src

  mcp:
    <<: *dev-service
    command: ["python", "-m", "connoisseur.mcp.server"]
    environment:
      CHROMA_PATH: /home/vscode/.local/share/connoisseur/chroma
      DATA_ROOT: /workspaces/agentic-restaurant-rag
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      PYTHONPATH: /workspaces/agentic-restaurant-rag/src
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-semantic}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ..:/workspaces/agentic-restaurant-rag:cached
      - dev_chroma_data:/home/vscode/.local/share/connoisseur/chroma
      - dev_chroma_model_cache:/home/vscode/.cache/chroma
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  api:
    <<: *dev-service
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "connoisseur.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "src",
      ]
    env_file:
      - ../.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      MCP_SERVER_URL: http://mcp:8001/mcp
      PYTHONPATH: /workspaces/agentic-restaurant-rag/src
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

  web:
    <<: *dev-service
    command: ["python", "-m", "connoisseur.client.gradio_app"]
    environment:
      API_BASE_URL: http://api:8000
      CLIENT_TIMEOUT_SECONDS: ${CLIENT_TIMEOUT_SECONDS:-300}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      PYTHONPATH: /workspaces/agentic-restaurant-rag/src
    ports:
      - "127.0.0.1:7860:7860"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

volumes:
  dev_chroma_data:
  dev_chroma_model_cache:
